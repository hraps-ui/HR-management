name: Deploy Supabase HR Portal API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/portal-api/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-function.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: rrcolbhgfzdbjprbuzer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy portal-api Edge Function
        run: supabase functions deploy portal-api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
