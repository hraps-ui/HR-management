<script>
/* ===== Standalone browser storage layer: no Google Sheets or Apps Script ===== */
let D={emp:[],vac:[],cand:[],lett:[],dsg:[],grievances:[],salarySlips:[],nid:100},CAN=false,IN=false,CHG=false,PWCHG=false,TOKEN="",HASH="",ROLE="",INFO={},loginMode="admin",EMP_ID=null,LOGIN_ID="",PROFILE_NAME="";
const employeeDefaultPassword=person=>"aps@"+code(person);
let saveTimer=null,savingNow=false,dirty=false,pollTimer=null,pollBusy=false;
const STORE_KEY="ajay_hr_standalone_data_v1", CRED_KEY="ajay_hr_standalone_credentials_v1";
const emptyD=()=>({emp:[],vac:[],cand:[],lett:[],dsg:[],grievances:[],salarySlips:[],nid:100});
const readStore=()=>{try{return JSON.parse(localStorage.getItem(STORE_KEY))||emptyD()}catch(e){return emptyD()}};
const writeStore=d=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(d));return true}catch(e){return false}};
const getCred=()=>{const fallback={adminId:"admin123",adminPw:"admin123",viewerId:"viewer",viewerPw:"viewer123",employeePasswords:{}};try{const c=JSON.parse(localStorage.getItem(CRED_KEY))||{};return {...fallback,...c,employeePasswords:c.employeePasswords&&typeof c.employeePasswords==="object"?c.employeePasswords:{}}}catch(e){return fallback}};
/* Public project identifiers only. The service-role key is kept in Supabase Function secrets. */
const SUPABASE_URL="https://rrcolbhgfzdbjprbuzer.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_QwDqb0JM8-CHpiatbJLPJw_STYAuhgC";
const CLOUD_ENDPOINT=SUPABASE_URL+"/functions/v1/portal-api";
const gs=async(fn,...a)=>{
 try{
  const response=await fetch(CLOUD_ENDPOINT,{method:"POST",headers:{"content-type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action:fn,args:a}),cache:"no-store"});
  const result=await response.json().catch(()=>null);
  if(!response.ok||!result)return {ok:false,msg:(result&&result.msg)||("Shared HR API returned HTTP "+response.status+". Check the Supabase Edge Function deployment and configuration.")};
  return result;
 }catch(error){console.error("Shared HR API error:",error);return {ok:false,msg:"Could not reach the shared HR database. Check your internet connection and confirm the Supabase portal-api Edge Function is deployed."}}
};
function setData(r){const d=r.data?JSON.parse(r.data):r;d.emp=d.emp||[];d.vac=d.vac||[];d.cand=d.cand||[];d.lett=d.lett||[];d.dsg=d.dsg||[];d.grievances=d.grievances||[];D=norm(d);HASH=r.hash||"local"}
function sessionLost(m){toast(m||"Your session has ended. Please login again.");lockAdm(true)}
const save=()=>{if(!CAN||!IN)return;dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,100)};
async function flush(){
 saveTimer=null;if(!dirty||savingNow||!IN)return;dirty=false;savingNow=true;
 const snapshot=JSON.stringify(D);
 try{
  writeStore(D);const result=await gs("api_save",TOKEN,HASH,snapshot);
  if(result&&result.ok){HASH=result.hash||HASH;writeStore(D)}
  else if(result&&result.sessionLost){sessionLost(result.msg)}
  else if(result&&result.conflict){try{localStorage.setItem(STORE_KEY+"_conflict_backup",snapshot)}catch(e){}toast("Another device changed the shared HR data. Your pending changes were backed up in this browser, but not uploaded. Reload the portal before making more changes.")}
  else{try{localStorage.setItem(STORE_KEY+"_cloud_error_backup",snapshot)}catch(e){}toast((result&&result.msg)||"Could not save to the shared database. A local recovery copy was kept.")}
 }catch(e){try{localStorage.setItem(STORE_KEY+"_cloud_error_backup",snapshot)}catch(err){}toast("Cloud save failed. A local recovery copy was kept.")}
 finally{savingNow=false}
}
function startPoll(){stopPoll();pollTimer=setInterval(poll,10000)}
function stopPoll(){clearInterval(pollTimer);pollTimer=null}
async function poll(){if(!IN||!TOKEN||dirty||savingNow||document.visibilityState==="hidden"||pollBusy)return;pollBusy=true;try{const r=await gs("api_poll",TOKEN,HASH);if(!r||!r.ok){if(r&&r.sessionLost)sessionLost(r.msg);return}if(r.changed&&r.data){setData(r);writeStore(D);render()}}catch(e){console.warn("Shared data refresh failed",e)}finally{pollBusy=false}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")poll()});
async function loginAdm(){
 const id=$("aid").value.trim(),pw=$("apw").value;if(!id||!pw)return msg("Enter your Employee ID and password");
 const b=document.querySelector("#auth .btn.p");if(b)b.disabled=true;
 try{
  const r=await gs("api_login",id,pw);if(!r.ok){msg(r.msg||"Employee ID or password is incorrect");return}
  TOKEN=r.token;ROLE=r.role;CAN=r.role==="admin";EMP_ID=r.empId||null;LOGIN_ID=id;
  let loaded=await gs("api_load",TOKEN);if(!loaded||!loaded.ok){TOKEN="";msg((loaded&&loaded.msg)||"Could not load the shared HR database.");return}
  if(loaded.needsSeed&&CAN){
   const localSnapshot=readStore();
   const localHasData=(localSnapshot.emp||[]).length||(localSnapshot.vac||[]).length||(localSnapshot.cand||[]).length||(localSnapshot.grievances||[]).length;
   const proceed=confirm("The Supabase shared database is empty. "+(localHasData?"Import the existing HR data from this browser (including employee records, HR records and grievances) into the shared database now?":"Initialize the shared database now?")+" This one-time import will not delete your browser's existing local copy.");
   if(!proceed){TOKEN="";msg("Import cancelled. Your existing browser data has been left untouched. Sign in again when ready to initialize the shared database.");return}
   const migrated=await gs("api_save",TOKEN,loaded.hash,JSON.stringify(localSnapshot));
   if(!migrated||!migrated.ok){TOKEN="";msg((migrated&&migrated.msg)||"Could not initialize the shared database. Your local data has been kept.");return}
   loaded=await gs("api_load",TOKEN);if(!loaded||!loaded.ok){TOKEN="";msg((loaded&&loaded.msg)||"Could not reload shared HR data.");return}
   toast("HR data was imported to the shared Supabase database.")
  }
  setData(loaded);IN=true;CHG=false;PWCHG=false;
  const matchedEmployee=(D.emp||[]).find(x=>String(code(x)).trim().toLowerCase()===id.toLowerCase()||(r.empId!=null&&String(x.id)===String(r.empId)));
  PROFILE_NAME=matchedEmployee&&matchedEmployee.name?String(matchedEmployee.name):(r.role==="admin"?"HR Admin":"Employee");
  writeStore(D);sync();startPoll();
 }catch(e){console.error(e);TOKEN="";msg("Could not open the shared HR database. Please check the Supabase setup and try again.")}
 finally{const b2=document.querySelector("#auth .btn.p");if(b2)b2.disabled=false}
}
async function lockAdm(silent){
 stopPoll();if(!silent&&CAN&&IN&&(dirty||saveTimer)){clearTimeout(saveTimer);await flush()}
 const oldToken=TOKEN;if(oldToken){try{await gs("api_logout",oldToken)}catch(e){}}
 TOKEN="";IN=false;CAN=false;CHG=false;PWCHG=false;ROLE="";EMP_ID=null;LOGIN_ID="";PROFILE_NAME="";MID=null;dirty=false;D=emptyD();HASH="";sync();mdlShow()
}
function sync(){$("pf").hidden=!IN;pfRender();if(IN&&!window._in){window._in=1;const s=PR().start;if(s&&TABS.includes(s)&&(s!=="Settings"||CAN))tab=s}else if(!IN)window._in=0;showAuth();render();$("foot").innerHTML=""}
function showAuth(){
 const el=$("auth");if(IN&&!CHG&&!PWCHG){el.innerHTML="";return}let h;
 if(PWCHG){
  const employee=(D.emp||[]).find(x=>String(x.id)===String(EMP_ID));

async function uploadProfilePhoto(input,id){

async function dlRep(fmt){if(!RPT)return;const r=reportData(RPT);if(!r.rows.length)return toast("This report has no data yet");

async function passportPhotoData(file){if(!file)return "";if(!/^image\//i.test(file.type||""))throw new Error("Please select an image file for the passport-size photo.");if(file.size>10*1024*1024)throw new Error("Photo must be smaller than 10 MB.");const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(new Error("Could not read the selected photo."));r.onload=()=>resolve(String(r.result||""));r.readAsDataURL(file)});return await new Promise((resolve,reject)=>{const img=new Image();img.onerror=()=>reject(new Error("Could not open the selected photo."));img.onload=()=>{try{const w=300,h=400,c=document.createElement("canvas");c.width=w;c.height=h;const scale=Math.max(w/img.width,h/img.height),sw=w/scale,sh=h/scale,sx=(img.width-sw)/2,sy=(img.height-sh)/2,ctx=c.getContext("2d");ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h);c.toBlob(blob=>{if(!blob)return reject(new Error("Could not compress the photo."));const fr=new FileReader();fr.onerror=()=>reject(new Error("Could not process the photo."));fr.onload=()=>resolve(String(fr.result||""));fr.readAsDataURL(blob)},"image/jpeg",0.72)}catch(e){reject(new Error("Could not process the photo."))}};img.src=data})}

e)throw new Error(body.error||body.message||`Notification API returned HTTP ${response.status}`);g.whatsappNotification={status:"sent",sentAt:new Date().toISOString(),messageId:String(body.messageId||""),to:"••••"+to.slice(-4)};save();render();toast("WhatsApp API accepted the grievance resolution message.")}catch(err){g.whatsappNotification={status:"failed",failedAt:new Date().toISOString(),error:String(err&&err.message||"Could not contact notification API").slice(0,220)};save();render();toast("WhatsApp notification failed. Check API settings and retry.")}}

async function readGrievanceAttachment(prefix){const input=$(prefix+"bankDocument"),f=input&&input.files&&input.files[0];if(!f)return null;const ext=f.name.split(".").pop().toLowerCase();if(ext==="pdf"){if(f.size>700*1024)throw new Error("PDF must be 700 KB or smaller.");const dataUrl=await fileAsDataURL(f);return{name:f.name,type:"application/pdf",dataUrl,size:f.size}}if(!["jpg","jpeg","png"].includes(ext))throw new Error("Please attach a PDF, JPG or PNG file.");const original=await fileAsDataURL(f);const dataUrl=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{try{const scale=Math.min(1,1200/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));const ctx=c.getContext("2d");ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",0.72))}catch(e){reject(new Error("Unable to compress the image. Please try another photo."))}};im.onerror=()=>reject(new Error("Could not open the selected image."));im.src=original});const approxBytes=Math.floor((dataUrl.length-String(dataUrl).indexOf(",")-1)*3/4);if(approxBytes>900*1024)throw new Error("The compressed image is still too large. Please use a smaller cheque/passbook photo.");return{name:f.name.replace(/\.(png|jpe?g)$/i,".jpg"),type:"image/jpeg",dataUrl,size:approxBytes}}

function ailParas(e){

 add("Employee name: "+e.name+"     Emp Code: "+code(e),{gap:0});

const t12=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||"");if(!m)return"";const h=+m[1];return String(h%12||12).padStart(2,"0")+":"+m[2]+" "+(h<12?"AM":"PM")};
function shiftTimes(){return AL.shift=="cus"?[AL.from,AL.to]:[SHIFTS[AL.shift][1],SHIFTS[AL.shift][2]]}
function abad(){return !D.emp.find(x=>x.id==AL.id)||!AL.mid||!AL.join||!String(AL.post).trim()||(AL.shift=="cus"&&(!AL.from||!AL.to))||(AL.an&&axCalc(AL.ax).tc<=0)}
function akeep(el){QP=true;const p=el.selectionStart;render();const n=$("aq");n.focus();n.setSelectionRange(p,p)}
function mkeep(el){QP=true;const p=el.selectionStart;render();const n=$("mq");n.focus();n.setSelectionRange(p,p)}
function apick(id){const e=D.emp.find(x=>x.id==id);AL.id=id;AL.q="";AL.issue=todayL();AL.post=(e&&e.desig)||"";AL.join=/^\d{4}-\d{2}-\d{2}$/.test((e&&e.joined)||"")?e.joined:"";AL.addr="";AL.mq="";AL.mid=null;AL.gen=false;render()}
function mpick(id){AL.mid=id;AL.mq="";AL.gen=false;render()}
function agen(){if(abad())return;AL.gen=true;render()}
function aset(k,v){AL[k]=v;AL.gen=false;render()}
function appHtml(){
 const sel=D.emp.find(e=>e.id==AL.id);
 if(!sel)return empSearchUI("Appointment letter","aq",AL.q,"AL.q=this.value;akeep(this)","apick");
 const mg=D.emp.find(e=>e.id==AL.mid),ok=!abad(),lb=t=>`<span class="empty" style="padding:0">${t}</span>`;
 let h=`<h2>Appointment letter</h2><div class="empty" style="padding:0 0 10px">Employee: <b>${E(sel.name)}</b> (${E(code(sel))}) \u00b7 ${E(sel.desig||"")} \u00b7 ${E(sel.dept||"")} <button class="x" style="color:var(--ac)" onclick="AL.id=null;AL.gen=false;render()">Change employee</button></div>`;

const fmt2=n=>Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
function psBlank(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return{q:"",id:null,month:d.getMonth()+1,year:d.getFullYear(),acct:"",ifsc:"",uan:"",esic:"NA",wd:"",wo:"",odm:"",hol:"",el:"",cl:"",ded:"",paid:"",elc:"",clc:"",basic:"",hra:"",conv:"0",med:"0",mob:"0",spl:"",ot:"",abonus:"",reimb:"",sdiff:"",ins:"",pf:"",pfauto:false,lwf:"",tds:"",adv:"",food:"",pt:"",oth:"",gen:false}}
let PS=psBlank();
const psn=v=>parseFloat(v)||0;
function psCalc(){const basic=psn(PS.basic),earn=basic+psn(PS.hra)+psn(PS.conv)+psn(PS.med)+psn(PS.mob)+psn(PS.spl),inc=psn(PS.ot)+psn(PS.abonus)+psn(PS.reimb)+psn(PS.sdiff),pf=PS.pfauto?Math.round(basic*0.12):psn(PS.pf),ded=psn(PS.ins)+pf+psn(PS.lwf)+psn(PS.tds)+psn(PS.adv)+psn(PS.food)+psn(PS.pt)+psn(PS.oth);return{basic:basic,earn:earn,inc:inc,pf:pf,ded:ded,net:earn+inc-ded}}
function psBad(){return !D.emp.find(x=>x.id==PS.id)||!(PS.month>=1&&PS.month<=12)||!(+PS.year>=2000)||psCalc().earn<=0}
function pskeep(el){QP=true;const p=el.selectionStart;render();const n=$("ps_q");n.focus();n.setSelectionRange(p,p)}
function pspick(id){const e=D.emp.find(x=>x.id==id);PS=psBlank();PS.id=id;PS.acct=(e&&e.acct)||"";PS.ifsc=(e&&e.ifsc)||"";PS.uan=(e&&e.uan)||"";PS.esic=(e&&e.esic)||"NA";render()}
function psSet(k,v){PS[k]=v;PS.gen=false;psRefresh()}
function psRefresh(){const C=psCalc(),s=$("psSum"),g=$("psGo"),o=$("psOut");if(s)s.innerHTML="Gross <b>"+fmt2(C.earn)+"</b> \u00b7 Incentives <b>"+fmt2(C.inc)+"</b> \u00b7 Deductions <b>"+fmt2(C.ded)+"</b> \u00b7 Net payable <b>"+fmt2(C.net)+"</b>";if(g)g.disabled=psBad();if(o)o.innerHTML=""}
function psGen(){if(psBad())return;PS.gen=true;const o=$("psOut"),e=D.emp.find(x=>x.id==PS.id);if(o&&e)o.innerHTML='<div class="row" style="margin:8px 0"><button class="btn" onclick="psdl(\'docx\')">\u2b07 Word</button><button class="btn" onclick="psdl(\'pdf\')">\u2b07 PDF</button></div>'+slipPreview(slipModel(e,"\u20b9"))}
const SALARY_PDF_DB="aeroplast_salary_pdf_files_v1";
function salaryPdfDb(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error("This browser does not support local PDF storage."));const req=indexedDB.open(SALARY_PDF_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("pdfs"))req.result.createObjectStore("pdfs")};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Could not open PDF storage."))})}
async function putSalaryPdf(sid,file){const db=await salaryPdfDb();return new Promise((resolve,reject)=>{const tx=db.transaction("pdfs","readwrite");tx.objectStore("pdfs").put({blob:file,name:file.name,type:file.type||"application/pdf",size:file.size},sid);tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{db.close();reject(tx.error||new Error("Could not save PDF."))};tx.onabort=()=>{db.close();reject(tx.error||new Error("PDF save cancelled."))}})}
async function getSalaryPdf(sid){const db=await salaryPdfDb();return new Promise((resolve,reject)=>{const tx=db.transaction("pdfs","readonly"),req=tx.objectStore("pdfs").get(sid);req.onsuccess=()=>{const v=req.result;db.close();resolve(v||null)};req.onerror=()=>{db.close();reject(req.error||new Error("Could not read PDF."))}})}
async function deleteSalaryPdfFile(sid){const db=await salaryPdfDb();return new Promise((resolve,reject)=>{const tx=db.transaction("pdfs","readwrite");tx.objectStore("pdfs").delete(sid);tx.oncomplete=()=>{db.close();resolve(true)};tx.onerror=()=>{db.close();reject(tx.error||new Error("Could not delete PDF."))}})}

function slipPdf(S,J){
 const doc=new J({unit:"pt",format:"a4"}),W=doc.internal.pageSize.getWidth(),M=38,TW=W-2*M,NAVY=[31,78,121],lh=64*209/280;let y=30;
 doc.addImage(LOGO,"JPEG",M,y,64,lh);
 doc.setFont("helvetica","bold");doc.setFontSize(15);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);doc.text(S.company,W/2+30,y+24,{align:"center"});
 doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(20,20,20);doc.text(S.addr,W/2+30,y+40,{align:"center"});
 y+=lh+12;
 const bar=(a,b)=>{doc.setFillColor(NAVY[0],NAVY[1],NAVY[2]);doc.rect(M,y,TW,21,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(10.5);if(b===undefined)doc.text(a,W/2,y+14.5,{align:"center"});else{doc.text(a,M+8,y+14.5);doc.text(b,M+TW/2+8,y+14.5)}y+=21};
 const tb=T=>{const sum=T.w.reduce((a,b)=>a+b,0),cs={};T.w.forEach((w,i)=>{cs[i]={cellWidth:w/sum*TW}});
  doc.autoTable({startY:y,margin:{left:M,right:M},theme:"grid",head:[T.head],body:T.rows.map(r=>r.map(c=>{const o=typeof c=="object"&&c!==null?c:{t:c};return{content:o.t==null?"":String(o.t),styles:o.b?{fontStyle:"bold"}:{}}})),styles:{font:"helvetica",fontSize:8.5,cellPadding:3.5,lineColor:[157,183,211],lineWidth:.5,textColor:[20,20,20]},headStyles:{fillColor:[214,228,240],textColor:NAVY,fontStyle:"bold"},columnStyles:cs,didParseCell:d=>{if(d.section=="body"&&T.green&&T.green.includes(d.row.index))d.cell.styles.fillColor=[226,239,218]}});
  y=doc.lastAutoTable.finalY+9};
 bar(S.title);y+=9;tb(S.t1);tb(S.t2);tb(S.t3);bar(S.net[0],S.net[1]);y+=16;
 doc.setTextColor(20,20,20);doc.setFont("helvetica","italic");doc.setFontSize(8);doc.text(S.note,W/2,y,{align:"center"});
 return doc.output("arraybuffer")}
async function psdl(fmt){const e=D.emp.find(x=>x.id==PS.id);if(!e||psBad())return;const dl=await claude.use("downloads").catch(()=>null);if(!dl)return toast("Download is not available in this view");
 const m=PS.month,yr=PS.year,mm=String(m).padStart(2,"0");
 if(CAN){e.acct=String(PS.acct).trim();e.ifsc=String(PS.ifsc).trim();e.uan=String(PS.uan).trim();e.esic=String(PS.esic).trim();save()}
 logL({type:"Salary slip",sub:MONTHS[m-1]+" "+yr,eid:e.id,code:code(e),name:e.name,dept:e.dept||"",desig:e.desig||"",issue:todayL(),date:yr+"-"+mm+"-01",ref:"PS/"+yr+"-"+mm+"/"+code(e)});
 const fn="pay-slip-"+String(code(e)).replace(/[^\w-]/g,"")+"-"+yr+"-"+mm;
 try{
  if(fmt=="pdf"){const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return toast("The PDF library did not load");await dl.save({filename:fn+".pdf",data:slipPdf(slipModel(e,"Rs."),J)})}
  else{if(!window.JSZip)return toast("The Word library did not load");await dl.save({filename:fn+".docx",data:await slipDocx(slipModel(e,"\u20b9"))})}
 }catch(err){if(err&&err.code!=="declined")toast("Could not save: "+(err.message||err.code))}}
